<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GLSDL</title>
  <style>
    html,
    body,
    object {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    object {
      display: block;
    }
  </style>
</head>
<body>
  <object type="application/x-shockwave-flash" data="test.swf" wmode="direct">
    <param name="movie" value="test.swf">
    <param name="wmode" value="direct">
    <param name="allowScriptAccess" value="sameDomain">
  </object>
</body>
</html>
